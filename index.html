<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Veřejný katalog akcí pro Pardubice, Chrudim a okolí.">
  <title>Akce Pardubicko</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="filters.css">
  <link rel="stylesheet" href="calendar.css">
  <link rel="stylesheet" href="detail-actions.css">
  <link rel="stylesheet" href="display-enhancements.css">
</head>
<body>
  <header class="hero">
    <div class="page-width">
      <p class="eyebrow">Pardubice · Chrudim · okolí</p>
      <h1>Akce Pardubicko</h1>
      <p>Veřejné akce v regionu, přehledně podle týdne.</p>
    </div>
  </header>

  <main class="page-width">
    <section class="controls" aria-label="Filtry akcí">
      <div class="primary-filters">
        <label class="control control-search">
          <span>Hledat</span>
          <input id="search" type="search" placeholder="Název, obec nebo místo…" autocomplete="off">
        </label>
        <label class="control control-week">
          <span>Týden</span>
          <select id="week"><option value="">Všechny týdny</option></select>
        </label>
      </div>

      <div class="quick-date-filter" role="group" aria-label="Rychlý výběr termínu">
        <button type="button" data-date-range="" class="active" aria-pressed="true">Vše</button>
        <button type="button" data-date-range="today" aria-pressed="false">Dnes</button>
        <button type="button" data-date-range="tomorrow" aria-pressed="false">Zítra</button>
        <button type="button" data-date-range="weekend" aria-pressed="false">Tento víkend</button>
      </div>

      <button id="advancedToggle" class="advanced-toggle" type="button" aria-expanded="false" aria-controls="advancedFilters">Další filtry</button>

      <div id="advancedFilters" class="advanced-filters">
        <label class="control">
          <span>Obec</span>
          <select id="municipality"><option value="">Všechny obce</option></select>
        </label>
        <label class="control">
          <span>Kategorie</span>
          <select id="category"><option value="">Všechny kategorie</option></select>
        </label>
        <label class="control">
          <span>Vstupné</span>
          <select id="price">
            <option value="">Jakékoli</option>
            <option value="free">Zdarma</option>
            <option value="paid">Placené</option>
            <option value="unknown">Neuvedeno</option>
          </select>
        </label>
        <label class="checkbox-control">
          <input id="futureOnly" type="checkbox">
          <span>Pouze budoucí akce</span>
        </label>
      </div>
    </section>

    <section class="toolbar" aria-label="Výsledky a zobrazení">
      <div>
        <strong id="count">Načítám…</strong>
        <span id="updated" class="updated"></span>
      </div>
      <div class="view-switch" role="group" aria-label="Zobrazení akcí">
        <button id="listView" type="button" aria-pressed="false">Seznam</button>
        <button id="calendarView" class="active" type="button" aria-pressed="true">Kalendář</button>
      </div>
    </section>

    <div id="error" class="message message-error" role="alert" hidden></div>
    <section id="events" class="events" aria-live="polite" aria-label="Seznam akcí" hidden></section>
    <section id="calendar" class="calendar" aria-live="polite" aria-label="Týdenní kalendář"></section>

    <noscript><p class="message">Pro zobrazení katalogu je nutné povolit JavaScript.</p></noscript>
  </main>

  <template id="event-template">
    <article class="event-card">
      <div class="event-date"></div>
      <div class="event-body">
        <div class="event-title-row">
          <h2 class="event-title"></h2>
          <div class="event-category category-badges"></div>
        </div>
        <div class="event-meta-row">
          <div class="event-location">
            <span class="event-municipality"></span>
            <p class="event-place"></p>
          </div>
          <span class="event-price"></span>
        </div>
        <p class="event-description"></p>
        <div class="event-footer">
          <span class="event-source-type"></span>
          <a class="event-source" target="_blank" rel="noopener noreferrer">Otevřít konkrétní zdroj</a>
        </div>
      </div>
    </article>
  </template>

  <dialog id="eventDetail" class="event-detail" aria-labelledby="eventDetailTitle">
    <article class="event-detail-card">
      <button class="event-detail-close" type="button" data-detail-close aria-label="Zavřít detail akce">×</button>
      <p class="event-detail-when"></p>
      <div class="event-detail-categories category-badges"></div>
      <h2 id="eventDetailTitle" class="event-detail-title"></h2>
      <p class="event-detail-place"></p>
      <p class="event-detail-description"></p>
      <dl class="event-detail-meta">
        <div><dt>Vstupné</dt><dd class="event-detail-price"></dd></div>
        <div><dt>Zdroj</dt><dd class="event-detail-source-type"></dd></div>
      </dl>
      <div class="event-detail-calendar-actions" aria-label="Kalendář a sdílení">
        <a class="event-detail-google event-detail-icon-button" target="_blank" rel="noopener noreferrer" aria-label="Přidat do Google Kalendáře" title="Přidat do Google Kalendáře">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M7 2v3M17 2v3M3.5 9h17M5 4h14a1.5 1.5 0 0 1 1.5 1.5v14A1.5 1.5 0 0 1 19 21H5a1.5 1.5 0 0 1-1.5-1.5v-14A1.5 1.5 0 0 1 5 4Z"/>
            <path d="M12 12v6M9 15h6"/>
          </svg>
        </a>
        <button type="button" class="secondary-button event-detail-ics event-detail-icon-button" aria-label="Stáhnout událost jako ICS" title="Stáhnout .ics">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M7 2v3M17 2v3M3.5 9h17M5 4h14a1.5 1.5 0 0 1 1.5 1.5v14A1.5 1.5 0 0 1 19 21H5a1.5 1.5 0 0 1-1.5-1.5v-14A1.5 1.5 0 0 1 5 4Z"/>
            <path d="M12 12v6M9.5 15.5 12 18l2.5-2.5"/>
          </svg>
        </button>
        <button type="button" class="secondary-button event-detail-share event-detail-icon-button" aria-label="Sdílet akci" title="Sdílet akci">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="18" cy="5" r="2.5"/>
            <circle cx="6" cy="12" r="2.5"/>
            <circle cx="18" cy="19" r="2.5"/>
            <path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5"/>
          </svg>
        </button>
      </div>
      <p class="event-detail-action-status" role="status" aria-live="polite"></p>
      <div class="event-detail-actions">
        <a class="event-detail-source" target="_blank" rel="noopener noreferrer">Přejít na stránku události</a>
        <button type="button" class="secondary-button" data-detail-close>Zavřít</button>
      </div>
    </article>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
